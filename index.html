<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>技能记录器 · 把一次操作，录成 Agent 的技能</title>
    <meta
      name="description"
      content="Skill Recorder 中文站：把你在电脑上做过一次的操作录下来，GitHub Copilot 还原出意图与有序步骤，一步生成可复用的 Skill 或按计划跑的自动化。录制、抽帧、转写都在本地完成。"
    />
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="技能记录器" />
    <meta property="og:title" content="技能记录器 · 把一次操作，录成 Agent 的技能" />
    <meta
      property="og:description"
      content="录一次真实操作，Copilot 还原成意图与步骤，生成 SKILL.md 或自动化。"
    />
    <meta property="og:image" content="/shots/library.png" />
    <link rel="preload" href="/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/switzer-500.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      document.documentElement.classList.add('js');
      try {
        const saved = localStorage.getItem('skill-recorder-theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b0c0e' : '#f4f5f6';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
